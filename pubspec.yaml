name: gamma_app
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown_plus:  ^1.0.5
  audioplayers: ^6.0.0
  http: ^1.2.0
  dash_chat_2: ^0.0.21
  flutter_dotenv: ^6.0.0
  cupertino_icons: ^1.0.8
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  google_sign_in: ^6.2.1
  google_fonts: ^6.3.3
  cloud_firestore: ^6.1.0
  zego_express_engine: ^3.22.1
  permission_handler: ^12.0.1
  video_player: ^2.10.1
  image_picker: ^1.0.7
  flutter_markdown: ^0.7.7+1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4


flutter:


  uses-material-design: true
  assets:
    - .env
    - assets/
    - assets/images/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"